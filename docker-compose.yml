services:
  postgres:
    image: postgres:16
    container_name: lm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legal_metrology
    ports:
      - "5433:5432"
    volumes:
      - lm_pg_data:/var/lib/postgresql/data

volumes:
  lm_pg_data:
